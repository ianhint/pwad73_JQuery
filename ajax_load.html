<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>

    <div id="box1">

        <h2> Contant will load here</h2>

    </div>

    <button id="btn1">Load file</button>

    <script>

        $(document).ready(function(){
            $("#btn1").click(function(){
                $("#box1").load("mytextfile.txt");
            });
        });

    </script>
    
</body>
</html>
